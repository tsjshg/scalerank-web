[workspace]
resolver = "3"
members = ["crates/scalerank-core", "crates/scalerank-py", "crates/scalerank-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/tsjshg/scalerank-web"

[profile.release]
lto = "thin"
codegen-units = 1

# tests run the optimiser on small data; unoptimised they take minutes
[profile.test]
opt-level = 3
