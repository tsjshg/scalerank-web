[package]
name = "scalerank-wasm"
description = "WebAssembly bindings of scalerank for the browser app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# the method and the comparison baselines, from github.com/tsjshg/scalerank
scalerank = { git = "https://github.com/tsjshg/scalerank", rev = "e296d553c2ba", default-features = false }
scalerank-baselines = { git = "https://github.com/tsjshg/scalerank", rev = "e296d553c2ba", default-features = false }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
