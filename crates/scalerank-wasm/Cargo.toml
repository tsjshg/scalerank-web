[package]
name = "scalerank-wasm"
description = "WebAssembly bindings of scalerank-core for the browser app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
scalerank-core = { path = "../scalerank-core", default-features = false }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
