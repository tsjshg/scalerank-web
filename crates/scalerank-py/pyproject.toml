[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "scalerank-rs"
description = "Python bindings of scalerank-core, for validation against drbench"
requires-python = ">=3.10"
dependencies = ["numpy"]
dynamic = ["version"]

[tool.maturin]
module-name = "scalerank_rs"
features = ["pyo3/extension-module"]
